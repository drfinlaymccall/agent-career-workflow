[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-career-workflow"
version = "0.1.0"
description = "An evidence-led, private-first career workflow for people and their agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Agent Career Workflow contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX",
  "Topic :: Office/Business",
]

[project.scripts]
careerflow = "careerflow.cli:main"

[tool.setuptools]
packages = ["careerflow"]
